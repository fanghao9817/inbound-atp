name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: api · mvn verify (Testcontainers Postgres + Kafka)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B --no-transfer-progress verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: surefire-reports, path: api/target/surefire-reports, if-no-files-found: ignore }
      - uses: actions/upload-artifact@v4
        with: { name: api-jar, path: api/target/inbound-atp-api-*.jar }

  web:
    name: web · vue-tsc + vite build + lint
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npx eslint . && npx oxlint .
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  data:
    name: data · dbt build against a throwaway Postgres
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: inbound, POSTGRES_USER: inbound, POSTGRES_PASSWORD: inbound }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U inbound" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install "dbt-postgres<2"
      # the API owns the schema; apply its migration so the sources exist, then build the models on the empty tables
      - run: psql postgresql://inbound:inbound@localhost:5432/inbound -v ON_ERROR_STOP=1 -f ../api/src/main/resources/db/migration/V1__schema.sql
      - run: dbt build --profiles-dir .
        env: { DBT_PG_HOST: localhost, DBT_PG_PASSWORD: inbound }

  aws:
    name: aws · cfn-lint templates + compile lambdas
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: infra/aws } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cfn-lint
      - run: cfn-lint bootstrap.yaml template.yaml
      - run: python -m py_compile functions/projector/app.py functions/availability/app.py
