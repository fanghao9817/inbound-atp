name: deploy

# Manual, or automatically after a green ci run triggered by a push to main of this repository
# (never a fork's pull request), deploying exactly the commit ci tested.
# Box: DEPLOY_HOST (34.208.44.222), DEPLOY_USER (ubuntu), DEPLOY_SSH_KEY repository secrets.
# AWS: no keys — GitHub's OIDC token assumes the role created by infra/aws/bootstrap.yaml.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency: { group: deploy, cancel-in-progress: false }

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  AWS_DEPLOY_ROLE: arn:aws:iam::266901698218:role/inbound-atp-github-deploy

jobs:
  aws:
    name: aws · deploy SAM stack via OIDC
    if: >-
      ${{ github.event_name == 'workflow_dispatch' || (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    outputs:
      availability_url: ${{ steps.outputs.outputs.availability_url }}
      projector_function: ${{ steps.outputs.outputs.projector_function }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - run: ./scripts/deploy-aws.sh
      - id: outputs
        run: |
          get() { aws cloudformation describe-stacks --stack-name inbound-atp --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "availability_url=$(get AvailabilityUrl)" >> "$GITHUB_OUTPUT"
          echo "projector_function=$(get ProjectorFunctionName)" >> "$GITHUB_OUTPUT"

  box:
    name: box · web + api + simulator + dbt
    needs: aws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - name: build web
        run: cd web && npm ci && npm run build
      - name: ssh key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          grep -v '^#' infra/ssh_known_hosts > ~/.ssh/known_hosts   # pinned host keys, no trust-on-first-use
      - name: sync sources and web build
        run: |
          rsync -az --delete --exclude .git --exclude api/target --exclude simulator/target --exclude web/node_modules --exclude .venv \
            --exclude 'infra/.env' --exclude 'data/seeds/*.csv' --exclude 'data/target' --exclude 'data/logs' -e "ssh -i ~/.ssh/deploy" ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/home/${{ secrets.DEPLOY_USER }}/inbound-atp/"
          rsync -az --delete --exclude '.well-known' -e "ssh -i ~/.ssh/deploy" web/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/demo/"
      - name: roll out api + simulator, refresh dbt models, re-score
        env:
          AVAILABILITY_URL: ${{ needs.aws.outputs.availability_url }}
          PROJECTOR_FUNCTION: ${{ needs.aws.outputs.projector_function }}
        run: |
          ssh -i ~/.ssh/deploy "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            AVAILABILITY_URL="$AVAILABILITY_URL" PROJECTOR_FUNCTION="$PROJECTOR_FUNCTION" bash -s <<'REMOTE'
            set -euo pipefail
            cd ~/inbound-atp
            . scripts/lib.sh
            # keep the box's runtime config in step with the stack outputs
            for k in AVAILABILITY_URL PROJECTOR_FUNCTION; do
              v="${!k}"; [ -n "$v" ] && env_set "$k" "$v"
            done
            ./scripts/deploy-api.sh
            dbt_pg build --quiet
            ./scripts/publish-dbt-docs.sh
            ./scripts/install-timers.sh >/dev/null
            internal_post eta/recalculate-all
          REMOTE
