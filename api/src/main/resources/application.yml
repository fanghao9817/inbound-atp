spring:
  application:
    name: inbound-atp-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/inbound}
    username: ${DB_USER:inbound}
    password: ${DB_PASSWORD:inbound}
    hikari:
      maximum-pool-size: 8
  flyway:
    schemas: public,analytics
  task:
    scheduling:
      pool:
        size: 4                                       # outbox relay, daily jobs and purges must not wait on each other
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: eta-recalc
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        # give up quickly when Kafka is down, so the outbox relay backs off instead of hanging
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  jackson:
    default-property-inclusion: non_null

app:
  topics:
    milestones: shipment.milestones
    eta-updated: shipment.eta-updated
    availability-changed: availability.changed
  orders:
    allocation-window-days: 2
    public-max-qty: 5
  business-zone: America/Vancouver
  internal-token: ${INTERNAL_API_TOKEN:}             # empty = internal endpoints only answer loopback callers
  outbox:
    poll-ms: 500
  seed:
    enabled: ${SEED_ENABLED:true}
  atp:
    horizon-days: 120
  aws:
    region: ${AWS_REGION:us-west-2}
    projector-function: ${PROJECTOR_FUNCTION:}      # empty = projection disabled (local dev, tests)
    availability-url: ${AVAILABILITY_URL:}

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
