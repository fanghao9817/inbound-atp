version: 2

sources:
  - name: inbound
    description: >
      Operational tables owned by the API (Flyway). Read-only from dbt. On Databricks the src() macro
      swaps the four lane tables for a weekly snapshot loaded as seeds; the order and stock models run
      on PostgreSQL only.
    database: "{{ env_var('DBT_PG_DB', 'inbound') }}"
    schema: public
    tables:
      - name: fulfillment_center
      - name: sku
      - name: purchase_order
      - name: shipment
      - name: shipment_milestone
        description: Append-only milestone log. Fed by the carrier/customs/WMS feeds (the simulator in this demo).
        loaded_at_field: recorded_at
        freshness:
          warn_after: { count: 2, period: day }
          error_after: { count: 4, period: day }
      - name: customer_order
        description: Customer demand and its outcome (RESERVED, SCHEDULED, BACKORDERED, SHIPPED, CANCELLED, REJECTED).
        loaded_at_field: created_at
        freshness:
          warn_after: { count: 6, period: hour }
          error_after: { count: 24, period: hour }
      - name: inventory_position
      - name: inventory_movement
        description: Append-only stock ledger; per position the deltas sum to inventory_position.
      - name: eta_prediction_log
        description: Every arrival prediction the API made, with the stage it was made from and why.
      - name: goods_receipt
