version: 2

sources:
  - name: inbound
    description: Operational tables owned by the API (Flyway). Read-only from dbt; on Databricks the src() macro swaps these for seeds.
    database: "{{ env_var('DBT_PG_DB', 'inbound') }}"
    schema: public
    tables:
      - name: shipment
      - name: shipment_milestone
        loaded_at_field: recorded_at
        freshness:
          warn_after: { count: 7, period: day }
      - name: purchase_order
      - name: fulfillment_center
