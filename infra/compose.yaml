name: inbound-atp

services:
  postgres:
    image: postgres:16
    container_name: inbound-postgres
    environment:
      POSTGRES_DB: inbound
      POSTGRES_USER: inbound
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-inbound}
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "max_connections=40"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbound -d inbound"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    container_name: inbound-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_HOURS: 336          # two weeks of events to replay from
      CLUSTER_ID: "inbound-atp-kraft-000001"
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  api:
    build: ../api
    image: inbound-atp-api:local
    container_name: inbound-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inbound
      DB_USER: inbound
      DB_PASSWORD: ${POSTGRES_PASSWORD:-inbound}
      KAFKA_BOOTSTRAP: kafka:9092
      SEED_ENABLED: "true"
      TZ: America/Vancouver
      AWS_REGION: ${AWS_REGION:-us-west-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      PROJECTOR_FUNCTION: ${PROJECTOR_FUNCTION:-}
      AVAILABILITY_URL: ${AVAILABILITY_URL:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      # the previous check opened fd 3 in a child shell and wrote to it from the outer one, so the
      # request never reached the API and the container showed "unhealthy" for weeks
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    mem_limit: 768m
    restart: unless-stopped

  # Synthetic carriers, warehouse, customers and buyer. Talks to the API over this network only,
  # with the internal token; no database access, no published port. See simulator/README.md.
  simulator:
    build: ../simulator
    image: inbound-atp-simulator:local
    container_name: inbound-simulator
    environment:
      API_BASE_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-}
      SIM_SEED: ${SIM_SEED:-}
      SIM_GO_LIVE: ${SIM_GO_LIVE:-}
      SIM_ENABLED: ${SIM_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/heartbeat -mmin -2 | grep -q ."]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 120s
      start_interval: 5s
    mem_limit: 384m
    restart: unless-stopped

  # Kafka browser for humans. Bound to localhost only: reach it through an SSH tunnel
  # (ssh -L 8081:127.0.0.1:8081), never through the public firewall.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: inbound-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: inbound
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: "-Xmx256m"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
  kafkadata:
