    root /var/www/demo;
    index index.html;

    # single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    limit_req_status 429;

    # The internal API (carrier/WMS feeds, orders, purchase orders, refreshes) is called by the simulator
    # and ops scripts on the box with a token; from the internet it does not exist.
    location /api/internal/ {
        return 404;
    }

    # public API: reads, the visitor order form and the ETA preview
    location /api/ {
        limit_req zone=inbound_read burst=40 nodelay;
        limit_req zone=inbound_write burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    # dbt-generated lineage docs (static, regenerated on every deploy)
    location /dbt/ {
        alias /var/www/dbt/;
        index index.html;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
