    root /var/www/demo;
    index index.html;

    # single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    limit_req_status 429;

    # operator-only writes (the simulator calls these on the internal network): read-only from the internet
    location ~ ^/api/(purchase-orders|notes|allocation/run|orders/[0-9]+/(ship|cancel))$ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # expensive full refreshes behind the "Re-score" / "Re-project" buttons: 2 per minute per client
    location ~ ^/api/(eta/recalculate-all|availability/project-all)$ {
        limit_req zone=inbound_admin burst=1 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # everything else: open reads, writes (placing an order, posting a milestone) 20 per minute per client
    location /api/ {
        limit_req zone=inbound_write burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }

    # dbt-generated lineage docs (static, regenerated on every deploy)
    location /dbt/ {
        alias /var/www/dbt/;
        index index.html;
    }

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
